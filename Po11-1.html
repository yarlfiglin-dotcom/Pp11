<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5A1024">
<meta name="description" content="Jarmund&Co – juridista apua Lahdessa.">
<title>Jarmund&Co – Lahti</title>

<style>
:root{
  --b:#5A1024;
  --bd:#3B0A18;
  --bk:#260812;
  --iv:#F5F1EA;
  --iv2:#EFEAE1;
  --ch:#B49A78;
  --ink:#20191A;
  --muted:#756D69;
  --ln:rgba(0,0,0,.12);
  --white:#fff;
  --max:1240px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  background:var(--iv);
}

body{
  margin:0;
  background:var(--iv);
  color:var(--ink);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

body.menu-open{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

::selection{
  background:var(--b);
  color:#fff;
}

/* =========================
   PROGRESS
========================= */

#progress{
  position:fixed;
  z-index:1000;
  top:0;
  left:0;
  width:0;
  height:2px;
  background:var(--b);
}

/* =========================
   HEADER
========================= */

.site-header{
  position:sticky;
  top:0;
  z-index:900;
  background:rgba(245,241,234,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--ln);
  transition:
    padding .35s var(--ease),
    box-shadow .35s ease,
    background .35s ease;
}

.nav-inner{
  width:min(var(--max),calc(100% - 48px));
  min-height:92px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:26px;
  transition:min-height .35s var(--ease);
}

.site-header.scrolled{
  box-shadow:0 8px 25px rgba(0,0,0,.045);
}

.site-header.scrolled .nav-inner{
  min-height:68px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.brand-mark{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border:1px solid var(--b);
  color:var(--b);
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:bold;
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.brand-text strong{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:.02em;
}

.brand-text small{
  margin-top:5px;
  font-size:8px;
  letter-spacing:.28em;
  color:var(--muted);
}

.desktop-nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:25px;
}

.desktop-nav a{
  position:relative;
  padding:7px 0;
  color:#433A3A;
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.desktop-nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1px;
  background:var(--b);
  transition:width .25s ease;
}

.desktop-nav a:hover::after,
.desktop-nav a.active::after{
  width:100%;
}

/* =========================
   LANGUAGE SWITCHER
========================= */

.language-switcher{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-left:4px;
  padding:3px;
  border:1px solid rgba(0,0,0,.14);
  background:rgba(255,255,255,.3);
  flex-shrink:0;
}

.language-switcher button{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--bd);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  font-size:9px;
  font-weight:800;
  letter-spacing:.11em;
  padding:8px 9px;
  cursor:pointer;
  transition:
    background .22s ease,
    color .22s ease,
    transform .22s ease;
}

.language-switcher button:hover{
  background:rgba(90,16,36,.08);
}

.language-switcher button.active{
  background:var(--b);
  color:#fff;
}

.language-switcher button:active{
  transform:translateY(1px);
}

.language-switcher button:focus-visible{
  outline:2px solid var(--b);
  outline-offset:2px;
}

/* =========================
   MENU BUTTON
========================= */

.menu-toggle{
  display:none;
  width:42px;
  height:42px;
  padding:10px;
  border:1px solid var(--ln);
  background:transparent;
  flex-direction:column;
  justify-content:center;
  gap:6px;
}

.menu-toggle span{
  width:100%;
  height:1px;
  background:var(--b);
  transition:transform .3s ease;
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  position:fixed;
  z-index:850;
  inset:68px 0 0;
  background:var(--iv);
  transform:translateY(-15px);
  opacity:0;
  pointer-events:none;
  transition:
    opacity .3s ease,
    transform .3s var(--ease);
  overflow:auto;
  border-top:1px solid var(--ln);
}

.mobile-menu.open{
  transform:translateY(0);
  opacity:1;
  pointer-events:auto;
}

.mobile-menu-inner{
  width:min(var(--max),calc(100% - 40px));
  margin:auto;
  padding:34px 0 50px;
}

.mobile-nav{
  display:flex;
  flex-direction:column;
}

.mobile-nav a{
  padding:17px 0;
  border-bottom:1px solid var(--ln);
  font-family:Georgia,serif;
  font-size:25px;
  color:var(--bd);
}

.mobile-language{
  margin-top:28px;
}

.mobile-language-label{
  margin-bottom:10px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

/* =========================
   GENERAL
========================= */

main{
  min-height:70vh;
}

.container{
  width:min(var(--max),calc(100% - 48px));
  margin:auto;
}

.section{
  padding:105px 0;
  border-bottom:1px solid var(--ln);
}

.section-sm{
  padding:70px 0;
  border-bottom:1px solid var(--ln);
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  color:var(--b);
  font-size:10px;
  font-weight:800;
  letter-spacing:.19em;
  text-transform:uppercase;
}

.eyebrow::before{
  content:"";
  width:34px;
  height:1px;
  background:var(--ch);
}

h1,h2,h3,h4{
  margin:0;
  color:var(--bd);
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  line-height:1.05;
}

h1{
  font-size:clamp(47px,6vw,82px);
  letter-spacing:-.045em;
}

h2{
  font-size:clamp(36px,4.4vw,58px);
  letter-spacing:-.035em;
}

h3{
  font-size:25px;
}

p{
  margin:0 0 16px;
}

.lead{
  max-width:700px;
  margin-top:25px;
  color:#544C4B;
  font-size:18px;
  line-height:1.8;
}

.muted{
  color:var(--muted);
}

.rule{
  width:100%;
  height:1px;
  background:var(--ln);
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:49px;
  padding:0 22px;
  border:1px solid var(--b);
  font-size:11px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
  overflow:hidden;
  transition:
    color .3s ease,
    background .3s ease,
    transform .25s ease;
}

.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--b);
  transform:translateY(101%);
  transition:transform .3s var(--ease);
  z-index:-1;
}

.btn:hover{
  color:#fff;
  transform:translateY(-2px);
}

.btn:hover::before{
  transform:translateY(0);
}

.btn-primary{
  color:#fff;
  background:var(--b);
}

.btn-primary::before{
  background:var(--bd);
  transform:translateY(0);
}

.btn-secondary{
  color:var(--b);
  background:transparent;
}

.btn-secondary:hover{
  color:#fff;
}

/* =========================
   HERO
========================= */

.hero{
  padding:92px 0 100px;
  border-bottom:1px solid var(--ln);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:80px;
  align-items:center;
}

.hero-copy{
  max-width:730px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:34px;
}

.hero-note{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}

.hero-visual{
  position:relative;
  min-height:470px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.document{
  position:relative;
  width:min(390px,90%);
  min-height:460px;
  background:#fffdf9;
  border:1px solid rgba(0,0,0,.13);
  padding:42px 38px;
  box-shadow:18px 24px 55px rgba(38,8,18,.09);
  transform:rotate(2.2deg);
}

.document::before{
  content:"";
  position:absolute;
  left:-15px;
  top:27px;
  width:100%;
  height:100%;
  border:1px solid rgba(90,16,36,.14);
  background:#f8f4ed;
  z-index:-1;
  transform:rotate(-4deg);
}

.doc-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px solid var(--ln);
  padding-bottom:18px;
}

.doc-logo{
  color:var(--b);
  font-family:Georgia,serif;
  font-size:18px;
}

.doc-number{
  color:var(--muted);
  font-size:8px;
  letter-spacing:.12em;
}

.doc-title{
  margin-top:43px;
  color:var(--bd);
  font-family:Georgia,serif;
  font-size:29px;
  line-height:1.12;
}

.doc-lines{
  margin-top:32px;
}

.doc-line{
  height:6px;
  margin-bottom:13px;
  background:#ded8cf;
}

.doc-line.short{
  width:62%;
}

.doc-line.medium{
  width:80%;
}

.stamp{
  position:absolute;
  right:24px;
  bottom:42px;
  width:92px;
  height:92px;
  display:grid;
  place-items:center;
  border:2px solid var(--b);
  border-radius:50%;
  color:var(--b);
  font-size:9px;
  font-weight:900;
  letter-spacing:.11em;
  text-align:center;
  transform:rotate(-12deg);
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--ln);
}

.stat{
  padding:42px 30px;
  border-right:1px solid var(--ln);
}

.stat:last-child{
  border-right:0;
}

.stat-number{
  color:var(--b);
  font-family:Georgia,serif;
  font-size:42px;
  line-height:1;
}

.stat-label{
  margin-top:12px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.stat-note{
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}

/* =========================
   CARDS
========================= */

.card{
  position:relative;
  border:1px solid var(--ln);
  background:rgba(255,255,255,.25);
  padding:30px;
  transition:
    transform .35s var(--ease),
    background .35s ease,
    border-color .35s ease;
}

.card:hover{
  transform:translateY(-5px);
  background:#fffdf9;
  border-color:rgba(90,16,36,.25);
}

.card-number{
  margin-bottom:38px;
  color:var(--ch);
  font-family:Georgia,serif;
  font-size:13px;
}

.card h3{
  margin-bottom:13px;
}

.card p{
  color:var(--muted);
  font-size:14px;
}

.card-price{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid var(--ln);
  color:var(--b);
  font-size:12px;
  font-weight:800;
}

.card-arrow{
  display:inline-block;
  margin-top:22px;
  color:var(--b);
  font-size:18px;
  transition:transform .25s ease;
}

.card:hover .card-arrow{
  transform:translateX(5px);
}

/* =========================
   STEPS
========================= */

.steps{
  counter-reset:step;
}

.step{
  position:relative;
  display:grid;
  grid-template-columns:80px 1fr;
  gap:30px;
  padding:31px 0;
  border-bottom:1px solid var(--ln);
}

.step:first-child{
  border-top:1px solid var(--ln);
}

.step-number{
  color:var(--b);
  font-family:Georgia,serif;
  font-size:34px;
}

.step h3{
  margin-bottom:8px;
}

.step p{
  margin:0;
  color:var(--muted);
}

/* =========================
   TRUST
========================= */

.trust{
  background:var(--bd);
  color:#fff;
}

.trust h2{
  color:#fff;
}

.trust .eyebrow{
  color:var(--ch);
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:50px;
  border-top:1px solid rgba(255,255,255,.18);
}

.trust-item{
  padding:30px 25px 0 0;
  margin-right:25px;
  border-right:1px solid rgba(255,255,255,.18);
}

.trust-item:last-child{
  border-right:0;
}

.trust-item h3{
  color:#fff;
  font-size:21px;
  margin-bottom:12px;
}

.trust-item p{
  color:rgba(255,255,255,.66);
  font-size:13px;
}

/* =========================
   TEAM
========================= */

.team-photo{
  height:290px;
  margin-bottom:22px;
  background:var(--iv2);
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  overflow:hidden;
}

.team-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.initials{
  color:var(--b);
  font-family:Georgia,serif;
  font-size:50px;
}

.team-title{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.team-area{
  margin-top:12px;
  color:var(--b);
  font-size:12px;
  font-weight:700;
}

/* =========================
   GUIDE
========================= */

.guide-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-top:1px solid var(--ln);
}

.guide-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:25px 5px 25px 0;
  border-bottom:1px solid var(--ln);
}

.guide-item:nth-child(odd){
  margin-right:40px;
}

.guide-item:nth-child(even){
  padding-left:40px;
  border-left:1px solid var(--ln);
}

.guide-item span:first-child{
  color:var(--bd);
  font-family:Georgia,serif;
  font-size:21px;
}

.guide-arrow{
  color:var(--b);
  font-size:20px;
}

/* =========================
   FAQ
========================= */

.faq{
  border-top:1px solid var(--ln);
}

.faq-item{
  border-bottom:1px solid var(--ln);
}

.faq-question{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:24px 0;
  border:0;
  background:none;
  color:var(--bd);
  text-align:left;
  font-family:Georgia,serif;
  font-size:21px;
}

.faq-icon{
  position:relative;
  width:22px;
  height:22px;
  flex-shrink:0;
}

.faq-icon::before,
.faq-icon::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:16px;
  height:1px;
  background:var(--b);
  transform:translate(-50%,-50%);
  transition:transform .3s ease;
}

.faq-icon::after{
  transform:translate(-50%,-50%) rotate(90deg);
}

.faq-item.open .faq-icon::after{
  transform:translate(-50%,-50%) rotate(0);
}

.faq-answer{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s var(--ease);
}

.faq-answer-inner{
  overflow:hidden;
}

.faq-answer p{
  max-width:800px;
  padding:0 0 25px;
  color:var(--muted);
}

/* =========================
   CONTACT
========================= */

.contact-layout{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:80px;
}

.contact-details{
  margin-top:40px;
}

.contact-detail{
  padding:18px 0;
  border-bottom:1px solid var(--ln);
}

.contact-detail small{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.contact-detail strong{
  color:var(--bd);
  font-family:Georgia,serif;
  font-size:20px;
  font-weight:500;
}

.form{
  padding:38px;
  border:1px solid var(--ln);
  background:#fffdf9;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--ln);
  background:var(--iv);
  color:var(--ink);
  padding:13px 14px;
  outline:none;
  transition:border-color .2s ease,background .2s ease;
}

.field textarea{
  min-height:145px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--b);
  background:#fff;
}

.form-note{
  margin-top:14px;
  color:var(--muted);
  font-size:10px;
}

/* =========================
   PRICE TABLE
========================= */

.price-table{
  border-top:1px solid var(--ln);
}

.price-row{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:30px;
  padding:22px 0;
  border-bottom:1px solid var(--ln);
}

.price-row strong{
  color:var(--bd);
  font-family:Georgia,serif;
  font-size:19px;
  font-weight:500;
}

.price-row span{
  color:var(--b);
  text-align:right;
  font-size:12px;
  font-weight:800;
}

/* =========================
   DETAIL PAGE
========================= */

.detail-hero{
  padding:85px 0 65px;
  border-bottom:1px solid var(--ln);
}

.detail-body{
  max-width:820px;
}

.detail-body h3{
  margin:45px 0 15px;
}

.detail-body p,
.detail-body li{
  color:#554D4B;
}

.detail-body ul{
  padding-left:22px;
}

/* =========================
   ABOUT
========================= */

.about-block{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
}

.about-quote{
  padding:38px;
  border-left:2px solid var(--b);
  background:var(--iv2);
}

.about-quote p{
  color:var(--bd);
  font-family:Georgia,serif;
  font-size:25px;
  line-height:1.4;
}

/* =========================
   SAMPLE NOTICE
========================= */

.demo-notice{
  margin-bottom:35px;
  padding:13px 16px;
  border:1px solid rgba(90,16,36,.22);
  background:rgba(90,16,36,.045);
  color:var(--muted);
  font-size:11px;
}

/* =========================
   FOOTER
========================= */

footer{
  background:var(--bk);
  color:#fff;
  padding:70px 0 30px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr 1fr;
  gap:45px;
}

.footer-brand{
  font-family:Georgia,serif;
  font-size:26px;
}

.footer-city{
  margin-top:7px;
  color:var(--ch);
  font-size:9px;
  letter-spacing:.22em;
}

.footer-heading{
  margin-bottom:17px;
  color:rgba(255,255,255,.5);
  font-size:9px;
  font-weight:800;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.footer-links a{
  color:rgba(255,255,255,.82);
  font-size:12px;
}

.footer-links a:hover{
  color:#fff;
}

.footer-bottom{
  margin-top:55px;
  padding-top:22px;
  border-top:1px solid rgba(255,255,255,.14);
  display:flex;
  justify-content:space-between;
  gap:25px;

/* =========================
   MOBILE ACTIONS
========================= */

/* =========================
   REVEAL ANIMATIONS
========================= */

.reveal{
  opacity:0;
  transform:translateY(22px);
  transition:
    opacity .75s var(--ease),
    transform .75s var(--ease);
}

.reveal.visible{
  opacity:1;
  transform:none;
}

.stagger > *{
  opacity:0;
  transform:translateY(18px);
}

.stagger.visible > *{
  animation:staggerIn .7s var(--ease) forwards;
}

.stagger.visible > *:nth-child(1){animation-delay:.04s}
.stagger.visible > *:nth-child(2){animation-delay:.10s}
.stagger.visible > *:nth-child(3){animation-delay:.16s}
.stagger.visible > *:nth-child(4){animation-delay:.22s}
.stagger.visible > *:nth-child(5){animation-delay:.28s}
.stagger.visible > *:nth-child(6){animation-delay:.34s}
.stagger.visible > *:nth-child(7){animation-delay:.40s}
.stagger.visible > *:nth-child(8){animation-delay:.46s}

@keyframes staggerIn{
  to{
    opacity:1;
    transform:none;
  }
}

const LANGS=["fi","ru","sv","en"];

const state={
  lang:localStorage.getItem("jarmundLang") || "fi",
  faqOpen:null
};

if(!LANGS.includes(state.lang)){
  state.lang="fi";
}

function D(){
  return DATA[state.lang];
}

/* =========================================================
   LANGUAGE
========================================================= */

function updateLanguageSwitcher(){

  document.querySelectorAll("[data-lang]").forEach(btn=>{
    const active=btn.dataset.lang===state.lang;

    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",String(active));
  });

  const label=document.getElementById("mobileLanguageLabel");

  if(label){
    label.textContent=D().ui.language;
  }
}

function setLanguage(lang){

  if(!LANGS.includes(lang)) return;

  state.lang=lang;

  localStorage.setItem("jarmundLang",lang);

  document.documentElement.lang=lang;

  document.title=D().meta.title;

  const description=document.querySelector('meta[name="description"]');

  if(description){
    description.content=D().meta.description;
  }

  closeMobileMenu();

  render();

  updateLanguageSwitcher();

  window.scrollTo({
    top:0,
    behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ? "auto"
      : "smooth"
  });
}

document.addEventListener("click",e=>{

  const langButton=e.target.closest("[data-lang]");

  if(langButton){
    e.preventDefault();
    setLanguage(langButton.dataset.lang);
  }

});

   HELPERS
========================================================= */

function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function route(){

  const hash=location.hash || "#/";

  return hash
    .replace(/^#\/?/,"")
    .split("/")
    .filter(Boolean);
}

function render(){

  if(!r.length){

    app.innerHTML=renderHome();

  }else if(r[0]==="palvelut" && !r[1]){

    app.innerHTML=renderServices();

  }else if(r[0]==="palvelut" && r[1]){

    app.innerHTML=renderServiceDetail(r[1]);

  }else if(r[0]==="hinnasto"){

    app.innerHTML=renderPricing();

  }else if(r[0]==="oppaat" && !r[1]){

    app.innerHTML=renderGuides();

  }else if(r[0]==="oppaat" && r[1]){

    app.innerHTML=renderGuideDetail(r[1]);

  }else if(r[0]==="miksi"){

    app.innerHTML=renderAbout();

  }else if(r[0]==="faq"){

    app.innerHTML=renderFaq();

  }else if(r[0]==="yhteys"){

    app.innerHTML=renderContact();

  }else{

    app.innerHTML=renderNotFound();

  }

  renderNavigation();
  renderFooter();
  initReveal();
  initCounters();

  window.scrollTo({
    top:0,
    behavior:"auto"
  });
}

/* =========================================================
   SCROLL
========================================================= */

function updateScroll(){

  const header=document.getElementById("siteHeader");

  header.classList.toggle("scrolled",window.scrollY>25);

  const doc=document.documentElement;

  const max=doc.scrollHeight-window.innerHeight;

  const progress=max>0
    ? (window.scrollY/max)*100
    : 0;

  document.getElementById("progress").style.width=
    Math.min(100,Math.max(0,progress))+"%";
}

window.addEventListener("scroll",updateScroll,{passive:true});

/* =========================================================
   REVEAL
========================================================= */

function initReveal(){

  const elements=document.querySelectorAll(".reveal");

  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){

    elements.forEach(el=>el.classList.add("visible"));
    return;

  }

  const observer=new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

      if(entry.isIntersecting){

        entry.target.classList.add("visible");
        observer.unobserve(entry.target);

      }

    });

  },{
    threshold:.12,
    rootMargin:"0px 0px -35px 0px"
  });

  elements.forEach(el=>observer.observe(el));
}

/* =========================================================
   COUNTERS
========================================================= */

function initCounters(){

  const counters=document.querySelectorAll("[data-count]");

  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  counters.forEach(el=>{

    const value=el.dataset.count;

    if(!/^\d+/.test(value)) return;

    const match=value.match(/^(\d+)/);

    if(!match) return;

    const target=Number(match[1]);

    if(target>100) return;

    let start=0;
    const duration=850;
    const startTime=performance.now();

    function tick(now){

      const progress=Math.min(
        1,
        (now-startTime)/duration
      );

      const eased=1-Math.pow(1-progress,3);

      const current=Math.round(target*eased);

      el.textContent=
        current+
        value.replace(/^\d+/,"");

      if(progress<1){
        requestAnimationFrame(tick);
      }

    }

    requestAnimationFrame(tick);

  });
}
